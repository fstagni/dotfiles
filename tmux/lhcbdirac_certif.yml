session_name: lhcbdirac_certif
windows:
  - window_name: monit
    layout: tiled
    panes:
      - shell_command:
          - sleep 5
          - conda activate dirac-development
      - shell_command:
          - cd /tmp
          - scp fstagni@lxplus.cern.ch:/afs/cern.ch/user/f/fstagni/.globus/usercert.pem .
          - scp fstagni@lxplus.cern.ch:/afs/cern.ch/user/f/fstagni/.globus/userkey.pem .
          - sleep 240
          - docker cp usercert.pem LHCbDIRAC_certif_client_dev:/root/.globus/
          - docker cp userkey.pem LHCbDIRAC_certif_client_dev:/root/.globus/
          - rm -Rf usercert.pem userkey.pem
  - window_name: clients
    layout: tiled
    panes:
      - shell_command:
          - sleep 60
          - docker container rm LHCbDIRAC_certif_client_dev
          - git clone --single-branch --branch integration git@github.com:DIRACGrid/DIRAC.git /tmp/LHCbDIRACCertif/dev/DIRAC
          - git clone --single-branch --branch devel ssh://git@gitlab.cern.ch:7999/lhcb-dirac/LHCbDIRAC.git /tmp/LHCbDIRACCertif/dev/LHCbDIRAC
          - git clone --single-branch --branch main git@github.com:DIRACGrid/diracx.git /tmp/LHCbDIRACCertif/dev/diracx
          - git clone --single-branch --branch master ssh://git@gitlab.cern.ch:7999/lhcb-dirac/lhcbdiracx.git /tmp/LHCbDIRACCertif/dev/lhcbdiracx
          - docker run -it --name LHCbDIRAC_certif_client_dev --mount type=bind,source=/tmp/LHCbDIRACCertif/dev/DIRAC,target=/code/DIRAC --mount type=bind,source=/tmp/LHCbDIRACCertif/dev/LHCbDIRAC,target=/code/LHCbDIRAC --mount type=bind,source=/tmp/LHCbDIRACCertif/dev/diracx,target=/code/diracx --mount type=bind,source=/tmp/LHCbDIRACCertif/dev/lhcbdiracx,target=/code/lhcbdiracx almalinux
          - PS1="\[\033[42m\]\[\033[31m\]\u@DEV_CLIENT\[\033[00m\] $ " && export GIT_SSL_NO_VERIFY=1 && mkdir client && cd client && curl -LO https://github.com/DIRACGrid/DIRACOS2/releases/latest/download/DIRACOS-Linux-$(uname -m).sh && bash DIRACOS-Linux-$(uname -m).sh && rm -Rf DIRACOS-Linux-$(uname -m).sh && source diracos/diracosrc && cd .. && pip install -e code/DIRAC/ && pip install -e code/LHCbDIRAC/ && pip install -e code/diracx/ && pip install -e code/lhcbdiracx/ && mkdir ~/.globus
          - pip install git+https://gitlab.cern.ch/lhcb-simulation/lbmcsubmit.git
  - window_name: servers
    layout: tiled
    panes:
      - shell_command:
          - ssh -J fstagni@lxtunnel.cern.ch fstagni@lhcbvoboxcertif00.cern.ch
          - PS1="\[\033[0;33m\]\t \[\033[0;31m\]\u@\[\033[0;32m\]\h:\[\033[0;36m\]\w \[\033[0m\] \n \[\033[0;33m\]|-> \[\033[0m\]"
          - cd /opt/dirac
          - clear
      - shell_command:
          - ssh -J fstagni@lxtunnel.cern.ch fstagni@lhcbvoboxcertif01.cern.ch
          - PS1="\[\033[0;33m\]\t \[\033[0;31m\]\u@\[\033[0;32m\]\h:\[\033[0;36m\]\w \[\033[0m\] \n \[\033[0;33m\]|-> \[\033[0m\]"
          - cd /opt/dirac
          - clear
